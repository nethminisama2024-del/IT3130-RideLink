spring.application.name=ride-management-service

server.port=8083

spring.datasource.url=jdbc:mysql://localhost:3306/ridelink_rides
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

driver.service.base-url=http://localhost:8082
driver.service.key=${RIDE_SERVICE_KEY}
fare-payment.service.base-url=http://localhost:8084
ride.fare.service.key=${RIDE_FARE_SERVICE_KEY}
account.service.base-url=http://localhost:8081
jwt.secret=${JWT_SECRET}
